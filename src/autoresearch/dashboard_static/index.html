<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoresearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  /* ── the overnight instrument, v3 ─────────────────────────────────
     Chart colors are the validated dark-mode reference palette. */
  :root {
    color-scheme: dark;
    --page:      #0c0c0d;
    --rail-bg:   #111112;
    --surface:   #18181a;
    --surface-2: #1f1f22;
    --inset:     #0e0e0f;
    --ink:       #f4f4f2;
    --ink-2:     #c3c2b7;
    --muted:     #8b897f;
    --faint:     #5b5a54;
    --grid:      #262628;
    --baseline:  #38383a;
    --border:    rgba(255,255,255,0.07);
    --border-2:  rgba(255,255,255,0.14);
    --val:       #3987e5;
    --val-soft:  rgba(57,135,229,0.13);
    --test:      #d95926;
    --good:      #0ca30c;
    --good-soft: rgba(12,163,12,0.12);
    --critical:  #d03b3b;
    --crit-soft: rgba(208,59,59,0.12);
    --ui:    "Geist", system-ui, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--page); }
  body {
    font-family: var(--ui); color: var(--ink-2); font-size: 13px;
    line-height: 1.5; height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(1200px 500px at 75% -12%, rgba(57,135,229,0.05), transparent 55%),
      var(--page);
  }
  .mono { font-family: var(--mono); }
  ::selection { background: var(--val-soft); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 5px;
                              border: 3px solid var(--page); }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: var(--ui); }

  /* ── top bar ── */
  header {
    display: flex; align-items: center; gap: 18px; flex: none; height: 58px;
    padding: 0 clamp(16px, 2.5vw, 30px);
    border-bottom: 1px solid var(--border);
    background: rgba(12,12,13,0.9); backdrop-filter: blur(8px);
  }
  .masthead { font-family: var(--serif); font-style: italic; font-size: 27px;
              color: var(--ink); letter-spacing: 0.01em; flex: none; }
  .masthead span { color: var(--val); }
  select#runpick {
    font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: 8px; padding: 7px 11px; max-width: 360px; cursor: pointer;
    transition: border-color .15s;
  }
  select#runpick:hover { border-color: var(--muted); }
  .pulse { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
           font-weight: 500; color: var(--good); white-space: nowrap; }
  .pulse .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
                box-shadow: 0 0 8px var(--good); animation: throb 1.6s ease-in-out infinite; }
  .pulse.done { color: var(--muted); }
  .pulse.done .dot { background: var(--muted); box-shadow: none; animation: none; }
  @keyframes throb { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  #runmeta { margin-left: auto; font-size: 12px; color: var(--faint);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #runmeta b { color: var(--ink-2); font-weight: 500; }
  #runmeta .sep { margin: 0 7px; color: var(--faint); }
  .hbtns { display: flex; gap: 8px; flex: none; }
  button.tbtn { font-size: 12px; font-weight: 500; color: var(--ink-2);
                background: var(--surface); border: 1px solid var(--border-2);
                border-radius: 8px; padding: 7px 13px; cursor: pointer;
                transition: all .15s; }
  button.tbtn:hover { border-color: var(--muted); color: var(--ink);
                      background: var(--surface-2); }

  /* ── layout ── */
  #app { display: flex; flex: 1; min-height: 0; }
  #rail { width: 336px; flex: none; border-right: 1px solid var(--border);
          background: var(--rail-bg); overflow-y: auto; }
  #main { flex: 1; min-width: 0; overflow-y: auto;
          padding: 18px clamp(16px, 2.5vw, 30px) 48px; }

  /* ── submit rail ── */
  .railhead { position: sticky; top: 0; z-index: 2; display: flex;
              align-items: center; gap: 8px;
              font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
              text-transform: uppercase; color: var(--muted);
              padding: 14px 16px 10px; background: var(--rail-bg); }
  .railhead .count { font-family: var(--mono); color: var(--faint); }
  .sub { position: relative; padding: 10px 16px 10px 18px; cursor: pointer;
         border-bottom: 1px solid var(--border); transition: background .12s; }
  .sub:hover { background: var(--surface); }
  .sub.sel { background: var(--surface-2); }
  .sub.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
                     width: 3px; background: var(--val); }
  .sub .top { display: flex; align-items: baseline; gap: 9px; }
  .sub .id { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
             min-width: 26px; }
  .sub .score { font-family: var(--mono); font-size: 12.5px; color: var(--ink);
                font-weight: 500; overflow-wrap: anywhere; letter-spacing: .01em; }
  .sub .score .dim { color: var(--faint); font-weight: 400; }
  .sub .star { color: var(--val); margin-left: auto; font-size: 12px; }
  .sub .meta { display: flex; gap: 9px; margin-top: 4px; align-items: center;
               padding-left: 35px; }
  .badge { font-family: var(--mono); font-size: 10px; padding: 1.5px 7px;
           border-radius: 999px; white-space: nowrap; flex: none; }
  .badge.up { color: var(--good); background: var(--good-soft); }
  .badge.tie { color: var(--muted); background: rgba(255,255,255,0.05); }
  .badge.down { color: var(--muted); background: rgba(255,255,255,0.05); }
  .badge.fail { color: var(--critical); background: var(--crit-soft); }
  .sub .note { font-size: 11px; color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; flex: 1; }

  /* ── stat strip ── */
  .stats { display: flex; background: var(--surface); border: 1px solid var(--border);
           border-radius: 14px; overflow: hidden; }
  .stat { flex: 1; padding: 16px 20px 14px; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--border); }
  .stat .k { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .1em; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: 25px; font-weight: 500;
             color: var(--ink); margin-top: 4px; overflow-wrap: anywhere;
             line-height: 1.25; }
  .stat .v small { font-size: 13px; color: var(--faint); font-weight: 400; }
  .stat .c { font-size: 11px; color: var(--faint); margin-top: 3px;
             font-family: var(--mono); }
  .stat.hero .v { color: var(--val); font-size: 21px; letter-spacing: .01em; }
  .stat .v .dim { color: var(--muted); font-weight: 400; }

  /* ── cards ── */
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; padding: 16px 20px; margin-top: 14px; }
  .card h2 { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
             letter-spacing: .1em; color: var(--muted); }
  .legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; }
  .legend .chipL { display: inline-flex; align-items: center; gap: 7px;
                   color: var(--ink-2); }
  .legend .sw { width: 16px; height: 3px; border-radius: 2px; }
  #chartwrap { position: relative; margin-top: 4px; }
  #chart { width: 100%; height: 250px; display: block; }
  #tooltip { position: absolute; pointer-events: none; background: #0c0c0df5;
             border: 1px solid var(--border-2); border-radius: 8px;
             padding: 9px 12px; font-size: 12px; display: none; z-index: 5;
             max-width: 380px; box-shadow: 0 12px 36px rgba(0,0,0,.6);
             font-family: var(--mono); }
  #tooltip .t1 { color: var(--ink); font-weight: 600; }
  #tooltip .t2 { color: var(--ink-2); margin-top: 2px; }
  #tooltip .t3 { color: var(--muted); margin-top: 4px; font-family: var(--ui);
                 overflow-wrap: anywhere; }

  /* ── detail ── */
  #detail { padding: 0; overflow: hidden; }
  #detail .dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
                   padding: 16px 20px 0; }
  #detail .dtitle { font-size: 16px; font-weight: 600; color: var(--ink);
                    letter-spacing: -.01em; }
  .pill { font-family: var(--mono); font-size: 11px; color: var(--muted);
          border: 1px solid var(--border); border-radius: 999px; padding: 2.5px 10px; }
  .pill.best { color: var(--val); border-color: rgba(57,135,229,.4);
               background: var(--val-soft); }
  .pill.failed { color: var(--critical); border-color: rgba(208,59,59,.4);
                 background: var(--crit-soft); }
  .tabs { display: flex; gap: 4px; padding: 14px 20px 0;
          border-bottom: 1px solid var(--border); }
  .tab { font-size: 12.5px; font-weight: 500; color: var(--muted);
         padding: 8px 14px 10px; cursor: pointer; border: none; background: none;
         border-bottom: 2px solid transparent; margin-bottom: -1px;
         transition: color .15s; }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--ink); border-bottom-color: var(--val); }
  .tabbody { padding: 18px 20px 20px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 7px 16px;
        font-size: 12.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
           overflow-wrap: anywhere; }
  .noteblock { background: var(--inset); border: 1px solid var(--border);
               border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
               font-size: 13.5px; line-height: 1.65; color: var(--ink-2);
               white-space: pre-wrap; }
  .noteblock.err { color: var(--critical); border-color: rgba(208,59,59,.3); }

  pre.codebox, .codewrap pre {
    background: var(--inset); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 16px; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    max-height: 520px; color: var(--ink-2); tab-size: 4;
  }
  .codewrap { min-width: 0; }
  .codewrap .fhead { display: flex; justify-content: space-between; align-items: baseline;
                     font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                     padding: 0 2px 7px; }
  .codewrap .fhead b { color: var(--ink-2); font-weight: 500; }
  .filegrid { display: grid; grid-template-columns: 250px 1fr; gap: 14px; }
  .flist { border: 1px solid var(--border); background: var(--inset);
           border-radius: 10px; overflow: hidden; align-self: start;
           max-height: 560px; overflow-y: auto; }
  .frow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 13px;
          font-family: var(--mono); font-size: 11.5px; cursor: pointer;
          border-bottom: 1px solid var(--border); transition: background .12s; }
  .frow:last-child { border-bottom: none; }
  .frow:hover { background: var(--surface); }
  .frow.sel { background: var(--surface-2); color: var(--ink);
              box-shadow: inset 3px 0 0 var(--val); }
  .frow .sz { color: var(--faint); flex: none; }
  .frow.hashonly { color: var(--faint); cursor: default; font-style: italic; }
  .diffbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
             font-size: 12.5px; color: var(--muted); }
  .diffbar select { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
                    background: var(--inset); border: 1px solid var(--border-2);
                    border-radius: 7px; padding: 5px 9px; }
  .dadd { color: var(--good); } .ddel { color: var(--critical); }
  .dhunk { color: var(--val); } .dmeta { color: var(--faint); }

  /* syntax highlighting: palette-mapped, quiet */
  .hljs-comment, .hljs-quote { color: var(--faint); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal { color: #6da7ec; }
  .hljs-string, .hljs-doctag, .hljs-regexp { color: #4fbd8c; }
  .hljs-number, .hljs-symbol, .hljs-bullet { color: #c98500; }
  .hljs-title, .hljs-function .hljs-title, .hljs-section { color: #9085e9; }
  .hljs-built_in, .hljs-builtin-name, .hljs-type { color: #d55181; }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-params { color: var(--ink-2); }
  .hljs-meta { color: var(--muted); }

  /* ── slide-over ── */
  #over { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
          z-index: 30; }
  #over.open { display: block; }
  #overpanel { position: absolute; top: 0; right: 0; bottom: 0; width: min(640px, 92vw);
               background: var(--surface); border-left: 1px solid var(--border-2);
               display: flex; flex-direction: column;
               box-shadow: -24px 0 60px rgba(0,0,0,.5); }
  #overhead { display: flex; justify-content: space-between; align-items: center;
              padding: 15px 20px; border-bottom: 1px solid var(--border);
              color: var(--ink); font-weight: 600; font-size: 14px; }
  #overbody { overflow: auto; padding: 16px 20px; flex: 1; }
  #overbody pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
                  white-space: pre-wrap; color: var(--ink-2); }
  .empty { color: var(--faint); padding: 36px 0; text-align: center; }
</style>
</head>
<body>
  <header>
    <div class="masthead">auto<span>research</span></div>
    <select id="runpick" onchange="switchRun(this.value)"></select>
    <span class="pulse" id="pulse"><span class="dot"></span><span id="pulsetext">connecting</span></span>
    <div id="runmeta"></div>
    <div class="hbtns">
      <button class="tbtn" onclick="openOver('rules')">rules</button>
      <button class="tbtn" onclick="openOver('agent')">agent log</button>
    </div>
  </header>

  <div id="app">
    <div id="rail">
      <div class="railhead">submits <span class="count" id="railcount"></span></div>
      <div id="sublist"></div>
    </div>
    <div id="main">
      <div class="stats" id="tiles"></div>
      <div class="card">
        <h2 id="charttitle">metric over submits</h2>
        <div class="legend" id="legend"></div>
        <div id="chartwrap">
          <svg id="chart" role="img" aria-label="metric over submits"></svg>
          <div id="tooltip"></div>
        </div>
      </div>
      <div class="card" id="detail"><div class="empty">no submits yet</div></div>
    </div>
  </div>

  <div id="over" onclick="if(event.target===this)closeOver()">
    <div id="overpanel">
      <div id="overhead"><span id="overtitle"></span><button class="tbtn" onclick="closeOver()">close</button></div>
      <div id="overbody"><pre id="overpre"></pre></div>
    </div>
  </div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const full = v => v === null || v === undefined ? "–" : String(v);
const expfmt = v => {
  if (v === 0) return "±0";
  return (v > 0 ? "+" : "−") + Math.abs(v).toExponential(2);
};
const bytes = n => n >= 1048576 ? (n/1048576).toFixed(1) + " MB" : n >= 1024 ? (n/1024).toFixed(1) + " KB" : n + " B";
const LANG = {py: "python", md: "markdown", json: "json", sh: "bash", bash: "bash",
              yaml: "yaml", yml: "yaml", js: "javascript", html: "xml", toml: "ini"};

const state = { runs: [], run: null, summary: null, selected: null, pinned: false,
                tab: "notes", diffBase: null, cache: {} };

/* ── data flow ─────────────────────────────────────────────────── */
async function api(path) {
  const sep = path.includes("?") ? "&" : "?";
  const res = await fetch(`/api/${path}${state.run ? sep + "run=" + encodeURIComponent(state.run) : ""}`);
  return res.json();
}

async function refreshRuns() {
  try {
    state.runs = await (await fetch("/api/runs")).json();
    if (!state.run && state.runs.length) state.run = state.runs[0].name;
    $("runpick").innerHTML = state.runs.map(r =>
      `<option value="${esc(r.name)}" ${r.name === state.run ? "selected" : ""}>` +
      `${esc(r.name)} · ${esc(r.experiment)}${r.live ? " · live" : ""}</option>`).join("");
  } catch (e) {}
}

async function refresh() {
  try {
    const s = await api("summary");
    if (s.error) return;
    state.summary = s;
    const records = s.records || [];
    const last = records.length ? records[records.length - 1].submit_id : null;
    if (!state.pinned && last !== null && state.selected !== last) {
      state.selected = last;
      delete state.cache[last];
    }
    if (state.selected !== null) {
      const rec = records.find(r => r.submit_id === state.selected);
      const cached = state.cache[state.selected];
      if (rec && cached && cached.record.status !== rec.status) delete state.cache[state.selected];
    }
    render();
  } catch (e) {}
}

function switchRun(name) {
  state.run = name; state.selected = null; state.pinned = false; state.cache = {};
  refresh();
}
function select(id) {
  const recs = (state.summary || {}).records || [];
  const last = recs[recs.length - 1];
  state.pinned = !(last && last.submit_id === id);
  state.selected = id;
  render();
}

/* ── derived ───────────────────────────────────────────────────── */
function objective() {
  const meta = (state.summary || {}).meta || {};
  if (meta.objective) return meta.objective;
  const r0 = ((state.summary || {}).records || []).find(r => r.metric);
  return {metric: r0 ? r0.metric.name : "metric", direction: "minimize",
          mode: r0 ? r0.mode : "?"};
}
function better(obj) { return obj.direction === "maximize" ? (a,b) => a > b : (a,b) => a < b; }

function annotate(records, obj) {
  const isBetter = better(obj);
  let best = null;
  return records.map(r => {
    let cls = "fail", delta = null;
    if (r.status === "scored" && r.metric) {
      if (best === null) { cls = "up"; }
      else {
        delta = r.metric.value - best;
        cls = r.metric.value === best ? "tie" : isBetter(r.metric.value, best) ? "up" : "down";
      }
      if (best === null || isBetter(r.metric.value, best)) best = r.metric.value;
    } else if (r.status === "snapshotted") cls = "tie";
    return {...r, _cls: cls, _delta: delta};
  });
}

/* the digits everyone shares are noise; dim them, surface the signal */
function commonPrefixLen(strings) {
  if (strings.length < 2) return 0;
  let p = strings[0];
  for (const s of strings.slice(1)) {
    let i = 0;
    while (i < p.length && i < s.length && p[i] === s[i]) i++;
    p = p.slice(0, i);
  }
  return p.length >= 5 ? p.length : 0;
}
function dimmed(valueStr, prefixLen) {
  if (!prefixLen || valueStr.length <= prefixLen) return esc(valueStr);
  return `<span class="dim">${esc(valueStr.slice(0, prefixLen))}</span>${esc(valueStr.slice(prefixLen))}`;
}

/* ── render ────────────────────────────────────────────────────── */
function render() {
  const s = state.summary;
  if (!s) return;
  const obj = objective();
  const records = annotate(s.records || [], obj);
  const scored = records.filter(r => r.status === "scored" && r.metric);
  const isBetter = better(obj);
  let best = null;
  for (const r of scored) if (!best || isBetter(r.metric.value, best.metric.value)) best = r;
  const prefixLen = commonPrefixLen(scored.map(r => String(r.metric.value)));

  const pulse = $("pulse");
  pulse.className = "pulse" + (s.finished || !s.live ? " done" : "");
  $("pulsetext").textContent = s.finished ? `finished · ${s.finished.reason}` : (s.live ? "live" : "idle");
  const meta = s.meta || {};
  $("runmeta").innerHTML =
    `<b>${esc(obj.direction)} ${esc(obj.metric)}</b><span class="sep">·</span>` +
    `${esc(obj.mode)} mode<span class="sep">·</span>` +
    `<b>${esc(meta.agent || "?")}</b> on <b>${esc(meta.runner || "?")}</b>`;

  // rail
  const multiAgent = new Set(records.map(r => r.agent).filter(Boolean)).size > 1;
  $("railcount").textContent = records.length || "";
  $("sublist").innerHTML = [...records].reverse().map(r => {
    const sel = r.submit_id === state.selected ? " sel" : "";
    const deltaText = r.status === "failed" ? "failed"
      : r._delta === null ? (r.status === "scored" ? "first" : r.status)
      : r._cls === "tie" ? "tie" : expfmt(r._delta);
    return `<div class="sub${sel}" onclick="select(${r.submit_id})">
      <div class="top"><span class="id">#${r.submit_id}</span>
        <span class="score">${r.metric ? dimmed(String(r.metric.value), prefixLen) : "–"}</span>
        ${r.best_so_far ? '<span class="star">★</span>' : ""}</div>
      <div class="meta"><span class="badge ${r._cls}">${deltaText}</span>
        ${multiAgent && r.agent ? `<span class="badge tie">${esc(r.agent)}</span>` : ""}
        <span class="note">${esc(r.payload && r.payload.notes || r.error || "")}</span></div>
    </div>`;
  }).join("");

  // stat strip
  const failed = records.filter(r => r.status === "failed").length;
  const kept = scored.filter(r => r.best_so_far).length;
  const ups = records.filter(r => r._cls === "up" && r._delta !== null);
  const lastGain = ups.length ? ups[ups.length - 1]._delta : null;
  const stop = meta.stop || {};
  $("tiles").innerHTML = `
    <div class="stat hero"><div class="k">best ${esc(obj.metric)}</div>
      <div class="v">${best ? dimmed(String(best.metric.value), 0) : "–"}</div>
      <div class="c">${best ? `#${best.submit_id} · ${best.commit.slice(0,8)}` : "no scored submits"}</div></div>
    <div class="stat"><div class="k">submits</div>
      <div class="v">${records.length}${stop.max_submits ? `<small> / ${stop.max_submits}</small>` : ""}</div>
      <div class="c">${failed ? failed + " failed" : "all scored"}</div></div>
    <div class="stat"><div class="k">kept</div>
      <div class="v">${kept}<small> / ${scored.length}</small></div>
      <div class="c">advanced the best</div></div>
    <div class="stat"><div class="k">last gain</div>
      <div class="v">${lastGain === null ? "–" : expfmt(lastGain)}</div>
      <div class="c">${s.finished ? "run over" : "latest improvement"}</div></div>`;

  $("charttitle").textContent = `${obj.metric} over submits`;
  renderChart(records, scored, obj);
  renderDetail(records);
}

/* ── chart ─────────────────────────────────────────────────────── */
function renderChart(records, scored, obj) {
  const svg = $("chart");
  const hasTest = scored.some(r => r.test_metric);
  $("legend").innerHTML =
    `<span class="chipL"><span class="sw" style="background:var(--val)"></span>val</span>` +
    (hasTest ? `<span class="chipL"><span class="sw" style="background:var(--test)"></span>test (kernel-only)</span>` : "");

  const W = svg.clientWidth || 800, H = 250;
  const M = {l: 112, r: 66, t: 16, b: 30};
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!records.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="var(--faint)" text-anchor="middle" font-size="12">no submits yet</text>`; return; }

  const xs = records.map(r => r.submit_id);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const values = [];
  for (const r of scored) { values.push(r.metric.value); if (r.test_metric) values.push(r.test_metric.value); }
  let vmin = values.length ? Math.min(...values) : 0, vmax = values.length ? Math.max(...values) : 1;
  if (vmin === vmax) { vmin -= 0.5; vmax += 0.5; }
  const pad = (vmax - vmin) * 0.1; vmin -= pad; vmax += pad;

  const X = v => xmax === xmin ? (M.l + (W - M.l - M.r) / 2) : M.l + (v - xmin) / (xmax - xmin) * (W - M.l - M.r);
  const Y = v => M.t + (1 - (v - vmin) / (vmax - vmin)) * (H - M.t - M.b);

  let g = `<defs><linearGradient id="valfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--val)" stop-opacity="0.14"/>
      <stop offset="1" stop-color="var(--val)" stop-opacity="0"/>
    </linearGradient></defs>`;
  const ticks = niceTicks(vmin, vmax, 4);
  const step = ticks.length > 1 ? ticks[1] - ticks[0] : 1;
  const decimals = Math.min(12, Math.max(0, Math.ceil(-Math.log10(step)) + 1));
  for (const t of ticks) {
    g += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${M.l - 9}" y="${Y(t) + 4}" fill="var(--muted)" font-size="10.5" text-anchor="end" font-family="IBM Plex Mono, monospace">${t.toFixed(decimals)}</text>`;
  }
  g += `<line x1="${M.l}" x2="${W - M.r}" y1="${H - M.b}" y2="${H - M.b}" stroke="var(--baseline)" stroke-width="1"/>`;
  const xstep = Math.max(1, Math.ceil((xmax - xmin) / 12));
  for (let x = xmin; x <= xmax; x += xstep) {
    g += `<text x="${X(x)}" y="${H - M.b + 18}" fill="var(--muted)" font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono, monospace">${x}</text>`;
  }

  const valPts = scored.filter(r => r.metric).map(r => [X(r.submit_id), Y(r.metric.value), r]);
  if (valPts.length > 1) {
    const line = valPts.map(p => p[0] + "," + p[1]).join(" ");
    g += `<polygon points="${valPts[0][0]},${H - M.b} ${line} ${valPts[valPts.length-1][0]},${H - M.b}" fill="url(#valfill)"/>`;
  }
  const series = [
    {key: "metric", color: "var(--val)", label: "val"},
    ...(hasTest ? [{key: "test_metric", color: "var(--test)", label: "test"}] : []),
  ];
  const endLabels = [];
  for (const ser of series) {
    const pts = scored.filter(r => r[ser.key]).map(r => [X(r.submit_id), Y(r[ser.key].value), r]);
    if (!pts.length) continue;
    g += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" fill="none" stroke="${ser.color}" stroke-width="2" stroke-linejoin="round"/>`;
    for (const [px, py, r] of pts) {
      const isBest = ser.key === "metric" && r.best_so_far;
      g += `<circle cx="${px}" cy="${py}" r="4" fill="${isBest ? ser.color : "var(--surface)"}" stroke="${ser.color}" stroke-width="2"/>`;
    }
    const last = pts[pts.length - 1];
    endLabels.push({x: last[0] + 10, y: last[1] + 4, label: ser.label});
  }
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < 14) endLabels[i].y = endLabels[i - 1].y + 14;
  }
  for (const l of endLabels) {
    g += `<text x="${l.x}" y="${l.y}" fill="var(--ink-2)" font-size="11">${l.label}</text>`;
  }
  for (const r of records.filter(r => r.status === "failed")) {
    g += `<text x="${X(r.submit_id)}" y="${H - M.b - 8}" fill="var(--critical)" font-size="12" text-anchor="middle" font-weight="600">✕</text>`;
  }

  g += `<line id="xhair" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" stroke="var(--baseline)" stroke-width="1" visibility="hidden"/>`;
  for (const r of records) {
    g += `<rect data-id="${r.submit_id}" x="${X(r.submit_id) - 9}" y="${M.t}" width="18" height="${H - M.t - M.b}" fill="transparent" style="cursor:pointer"/>`;
  }
  svg.innerHTML = g;

  const tooltip = $("tooltip"), xhair = $("xhair");
  svg.querySelectorAll("rect[data-id]").forEach(rect => {
    const r = records.find(q => q.submit_id === +rect.dataset.id);
    rect.addEventListener("click", () => select(r.submit_id));
    rect.addEventListener("mousemove", event => {
      xhair.setAttribute("x1", X(r.submit_id)); xhair.setAttribute("x2", X(r.submit_id));
      xhair.setAttribute("visibility", "visible");
      tooltip.style.display = "block";
      const wrap = $("chartwrap").getBoundingClientRect();
      tooltip.style.left = Math.max(0, Math.min(event.clientX - wrap.left + 14, wrap.width - 390)) + "px";
      tooltip.style.top = (event.clientY - wrap.top + 14) + "px";
      tooltip.innerHTML =
        `<div class="t1">#${r.submit_id} · ${esc(r.status)}${r.best_so_far ? " · best" : ""}</div>` +
        (r.metric ? `<div class="t2">val ${full(r.metric.value)}</div>` : "") +
        (r.test_metric ? `<div class="t2">test ${full(r.test_metric.value)}</div>` : "") +
        `<div class="t3">${esc(r.error || (r.payload && r.payload.notes) || "")}</div>`;
    });
    rect.addEventListener("mouseleave", () => {
      tooltip.style.display = "none"; xhair.setAttribute("visibility", "hidden");
    });
  });
}

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n + 1) || mag * 10;
  const start = Math.ceil(lo / step) * step, out = [];
  for (let v = start; v <= hi + 1e-12; v += step) out.push(+v.toPrecision(12));
  return out;
}

/* ── code rendering ────────────────────────────────────────────── */
function highlight(code, path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  const lang = LANG[ext];
  if (window.hljs && lang) {
    try { return hljs.highlight(code, {language: lang, ignoreIllegals: true}).value; }
    catch (e) {}
  }
  return esc(code);
}

/* ── detail panel ──────────────────────────────────────────────── */
async function detailData(id) {
  if (!state.cache[id]) {
    state.cache[id] = await api(`submit/${id}`);
    state.cache[id].tree = null; state.cache[id].files = {}; state.cache[id].diffs = {};
  }
  return state.cache[id];
}

function renderDetail(records) {
  const el = $("detail");
  const rec = records.find(r => r.submit_id === state.selected);
  if (!rec) { el.innerHTML = `<div class="empty">no submits yet</div>`; return; }
  const tabs = ["notes", "viz", "files", "eval", "diff"];
  el.innerHTML = `
    <div class="dhead">
      <span class="dtitle">submit #${rec.submit_id}</span>
      <span class="pill ${rec.status === "failed" ? "failed" : ""}">${esc(rec.status)}</span>
      ${rec.best_so_far ? '<span class="pill best">★ best so far</span>' : ""}
      ${rec.agent ? `<span class="pill">${esc(rec.agent)}</span>` : ""}
      <span class="pill">${esc(rec.commit.slice(0, 12))}</span>
    </div>
    <div class="tabs">${tabs.map(t =>
      `<button class="tab ${state.tab === t ? "on" : ""}" onclick="setTab('${t}')">${t}</button>`).join("")}
    </div>
    <div class="tabbody" id="tabbody"><div class="empty">loading…</div></div>`;
  renderTab(rec, records);
}

function setTab(t) { state.tab = t; render(); }

async function renderTab(rec, records) {
  const body = $("tabbody");
  const id = rec.submit_id;
  try {
    if (state.tab === "notes") {
      const d = await detailData(id);
      if (id !== state.selected) return;
      const r = d.record, t = d.timing || {};
      const extra = Object.entries(r.payload || {}).filter(([k]) => k !== "notes");
      body.innerHTML = `
        <div class="noteblock">${esc((r.payload || {}).notes || "(no notes)")}</div>
        ${r.error ? `<div class="noteblock err">${esc(r.error)}</div>` : ""}
        <div class="kv">
          <span class="k">${esc(objective().metric)}</span><span class="v">${r.metric ? full(r.metric.value) : "–"}</span>
          ${r.test_metric ? `<span class="k">test (kernel-only)</span><span class="v">${full(r.test_metric.value)}</span>` : ""}
          <span class="k">submitted</span><span class="v">${esc(r.time)}</span>
          ${t.eval_started ? `<span class="k">eval window</span><span class="v">${esc(t.eval_started)} → ${esc(t.eval_finished || "…")}</span>` : ""}
          <span class="k">commit</span><span class="v">${esc(r.commit)}</span>
          <span class="k">image</span><span class="v">${esc(r.image_digest)}</span>
          <span class="k">mode</span><span class="v">${esc(r.mode)}</span>
          ${extra.map(([k, v]) => `<span class="k">${esc(k)}</span><span class="v">${esc(JSON.stringify(v))}</span>`).join("")}
        </div>
        ${(r.large_files || []).length ? `
          <h2 style="margin:18px 0 8px">large files (hash-only)</h2>
          <div class="kv">${r.large_files.map(f =>
            `<span class="k">${esc(f.path)}</span><span class="v">${f.size_mb} MB · sha256 ${esc(f.sha256.slice(0, 16))}…</span>`).join("")}
          </div>` : ""}`;
    } else if (state.tab === "viz") {
      const info = await api(`vizinfo/${id}`);
      if (id !== state.selected) return;
      if (!info.exists) {
        body.innerHTML = info.error
          ? `<div class="noteblock err">viz failed: ${esc(info.error)}</div>`
          : `<div class="empty">no visualization for this submit (the experiment can define objective.viz_command)</div>`;
      } else if (info.kind === "text/html") {
        body.innerHTML = `<iframe src="/api/viz/${id}?run=${encodeURIComponent(state.run)}"
          style="width:100%;height:560px;border:1px solid var(--border);border-radius:10px;background:var(--inset)"></iframe>`;
      } else {
        body.innerHTML = `<div style="text-align:center;background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:16px">
          <img src="/api/viz/${id}?run=${encodeURIComponent(state.run)}" style="max-width:100%;max-height:560px"/></div>`;
      }
    } else if (state.tab === "files") {
      const d = await detailData(id);
      if (!d.tree) d.tree = await api(`tree/${id}`);
      if (id !== state.selected) return;
      const files = d.tree.files || [];
      const hashOnly = d.tree.large_files || [];
      body.innerHTML = `<div class="filegrid">
        <div class="flist">${files.map(f =>
          `<div class="frow" data-p="${esc(f.path)}"><span>${esc(f.path)}</span><span class="sz">${bytes(f.size)}</span></div>`).join("")}
          ${hashOnly.map(f =>
          `<div class="frow hashonly" title="not stored; sha256 ${esc(f.sha256)}"><span>${esc(f.path)}</span><span class="sz">${f.size_mb} MB</span></div>`).join("")}
        </div>
        <div class="codewrap">
          <div class="fhead"><b id="fpath">select a file</b><span id="fsize"></span></div>
          <pre><code id="fileview">…</code></pre>
        </div></div>`;
      body.querySelectorAll(".frow[data-p]").forEach(row => row.addEventListener("click", async () => {
        body.querySelectorAll(".frow").forEach(x => x.classList.remove("sel"));
        row.classList.add("sel");
        const path = row.dataset.p;
        if (!d.files[path]) d.files[path] = await api(`file/${id}?path=${encodeURIComponent(path)}`);
        $("fpath").textContent = path;
        $("fsize").textContent = row.querySelector(".sz").textContent;
        $("fileview").innerHTML = highlight(d.files[path].content, path)
          + (d.files[path].truncated ? "\n… (truncated)" : "");
      }));
      const first = body.querySelector(".frow[data-p]");
      if (first) first.click();
    } else if (state.tab === "eval") {
      const d = await detailData(id);
      if (id !== state.selected) return;
      const logs = d.eval_logs || {};
      body.innerHTML = Object.keys(logs).length
        ? Object.entries(logs).map(([split, text]) =>
            `<h2 style="margin-bottom:8px">${split} eval</h2><pre class="codebox" style="margin-bottom:16px">${esc(text)}</pre>`).join("")
        : `<div class="empty">no eval logs (reported mode or not scored yet)</div>`;
    } else if (state.tab === "diff") {
      const others = records.filter(r => r.submit_id !== id);
      const base = state.diffBase !== null && others.some(r => r.submit_id === state.diffBase)
        ? state.diffBase
        : (others.filter(r => r.submit_id < id).map(r => r.submit_id).pop() ?? (others[0] && others[0].submit_id));
      if (base === undefined) { body.innerHTML = `<div class="empty">nothing to diff against</div>`; return; }
      const d = await detailData(id);
      if (!d.diffs[base]) d.diffs[base] = await api(`diff/${base}/${id}`);
      if (id !== state.selected) return;
      const diff = d.diffs[base].diff || "(no tracked changes between these submits)";
      body.innerHTML = `
        <div class="diffbar">comparing against
          <select onchange="state.diffBase = +this.value; render()">${others.map(r =>
            `<option value="${r.submit_id}" ${r.submit_id === base ? "selected" : ""}>#${r.submit_id}</option>`).join("")}
          </select> → #${id}</div>
        <pre class="codebox">${diff.split("\n").map(line => {
          const cls = line.startsWith("+") && !line.startsWith("+++") ? "dadd"
                    : line.startsWith("-") && !line.startsWith("---") ? "ddel"
                    : line.startsWith("@@") ? "dhunk"
                    : /^(diff |index |\+\+\+|---)/.test(line) ? "dmeta" : "";
          return `<span class="${cls}">${esc(line)}</span>`;
        }).join("\n")}</pre>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="empty">failed to load: ${esc(e.message)}</div>`;
  }
}

/* ── slide-over ────────────────────────────────────────────────── */
let overMode = null, overTimer = null;
async function openOver(mode) {
  overMode = mode;
  $("over").classList.add("open");
  $("overtitle").textContent = mode === "rules" ? "experiment rules" : "agent log";
  await fillOver();
  if (mode === "agent") overTimer = setInterval(fillOver, 3000);
}
async function fillOver() {
  if (overMode === "rules") {
    $("overpre").innerHTML = highlight((state.summary || {}).rules || "(no rules.md)", "rules.md");
  } else {
    const d = await api("agentlog?tail=500");
    const bodyEl = $("overbody");
    const stick = Math.abs(bodyEl.scrollHeight - bodyEl.scrollTop - bodyEl.clientHeight) < 40;
    $("overpre").textContent = d.content || "(empty)";
    if (stick) bodyEl.scrollTop = bodyEl.scrollHeight;
  }
}
function closeOver() {
  $("over").classList.remove("open");
  if (overTimer) { clearInterval(overTimer); overTimer = null; }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOver(); });

/* ── boot ──────────────────────────────────────────────────────── */
(async () => { await refreshRuns(); await refresh(); })();
setInterval(refresh, 2000);
setInterval(refreshRuns, 10000);
window.addEventListener("resize", () => state.summary && render());
</script>
