[project]
name = "autoresearch-kernel"
version = "0.1.0"
description = "The autoresearch kernel: experiments as folders (seed + rules + objective), agents and runners as swappable pillars."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ar = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]
